[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrm-cli"
version = "0.1.0"
description = "Water Resources Modeling CLI - Run EPA SWMM & EPANET simulations in the cloud"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
wrapi = "wrapi:main"

[tool.setuptools]
py-modules = ["wrapi"]
